<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Representante - Plus Capital</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .cadastro-container {
            max-width: 700px;
            margin: 40px auto;
            background: var(--white);
            border-radius: 8px;
            padding: 40px;
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>
    <div class="cadastro-container">
        <div class="logo-box" style="text-align: center; margin-bottom: 30px;">
            <div class="logo">+Plus</div>
            <div class="logo-subtitle">CAPITAL</div>
        </div>

        <h1 class="page-title" style="text-align: center;">Cadastro de Representante</h1>
        <p class="page-subtitle" style="text-align: center; margin-bottom: 30px;">Preencha os dados para se tornar um representante Plus Capital</p>

        <div id="message" class="message"></div>

        <form id="cadastroForm" class="form">
            <div class="form-group">
                <label for="nomeCompleto">Nome Completo *</label>
                <input type="text" id="nomeCompleto" name="nomeCompleto" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" name="cpf" required maxlength="14" placeholder="000.000.000-00">
            </div>

            <div class="form-group">
                <label for="email">E-mail *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="celular">Número de Celular *</label>
                <input type="tel" id="celular" name="celular" required placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
                <label for="endereco">Endereço Completo *</label>
                <textarea id="endereco" name="endereco" required></textarea>
            </div>

            <div class="form-group">
                <label for="estadoCivil">Estado Civil *</label>
                <select id="estadoCivil" name="estadoCivil" required>
                    <option value="">Selecione...</option>
                    <option value="solteiro">Solteiro(a)</option>
                    <option value="casado">Casado(a)</option>
                    <option value="divorciado">Divorciado(a)</option>
                    <option value="viuvo">Viúvo(a)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="profissao">Profissão *</label>
                <input type="text" id="profissao" name="profissao" required>
            </div>

            <div class="form-group">
                <label for="experiencias">Conte-nos sobre suas experiências *</label>
                <textarea id="experiencias" name="experiencias" required></textarea>
                <div class="helper-text">Descreva sua experiência profissional relevante</div>
            </div>

            <div class="form-group">
                <label for="motivacao">Por que decidiu virar representante? *</label>
                <textarea id="motivacao" name="motivacao" required></textarea>
                <div class="helper-text">Conte-nos sua motivação</div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="termos" name="termos" required>
                    Aceito os termos de uso e política de privacidade *
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Enviar Cadastro</button>
        </form>
    </div>

    <script>
        const adminCodigo = window.location.pathname.split('/').pop();

        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            }
        });

        document.getElementById('celular').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/(\d{2})(\d)/, '($1) $2');
                value = value.replace(/(\d{5})(\d)/, '$1-$2');
                e.target.value = value;
            }
        });

        document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                adminCodigo: adminCodigo,
                nomeCompleto: document.getElementById('nomeCompleto').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value,
                celular: document.getElementById('celular').value,
                endereco: document.getElementById('endereco').value,
                estadoCivil: document.getElementById('estadoCivil').value,
                profissao: document.getElementById('profissao').value,
                experiencias: document.getElementById('experiencias').value,
                motivacao: document.getElementById('motivacao').value
            };

            try {
                const response = await fetch('/api/cadastro-representante', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showMessage(result.message, 'success');
                    setTimeout(() => {
                        document.getElementById('cadastroForm').reset();
                    }, 2000);
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Erro ao enviar cadastro', 'error');
            }
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message message-${type} show`;
            setTimeout(() => msg.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
